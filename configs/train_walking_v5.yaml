# Walking v5 = v4 (2x lin-vel tracking) + fixes for issues seen in the v4 GIFs:
#  - yaw drift: restore upstream's yaw:lin tracking ratio (v4 halved it)
#  - head used as a balance mass: head-tracking cost
#  - no recovery steps after pushes: suspend stand-still cost for 1.5 s after each push
base: configs/train_walking_v4.yaml
env:
  push:
    recovery_window_s: 1.5
  rewards:
    scales:
      tracking_ang_vel: 12.0
      head_tracking: -5.0
    suspend_after_push: [stand_still]
